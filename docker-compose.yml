services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
            - redis

    web:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    db:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-job_tracker}
            POSTGRES_USER: ${DB_USERNAME:-tracker_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis-data:/data

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=3 --tries=3
        volumes:
            - ./:/var/www/html
        depends_on:
            - redis
            - db

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
        volumes:
            - ./:/var/www/html
        depends_on:
            - redis
            - db

volumes:
    db-data:
    redis-data:
